name: Check

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: PYTHON_VER=${{ matrix.python-version }} make deps

      - run: make test
