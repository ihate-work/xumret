[project]
name = "xumret"
version = "0.1.0"
description = "Remote control suite for termux-api"
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xumret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
