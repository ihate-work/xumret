[project]
name = "xumret"
version = "0.1.0"
description = "Remote control for termux and termux-api"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
exclude-newer = "7d"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xumret"]

[tool.pytest.ini_options]
testpaths = ["src/"]

[tool.coverage.run]
source = ["src/xumret"]
omit = [
    "*_test.py",
    "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
